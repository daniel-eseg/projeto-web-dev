<!DOCTYPE html>
<!-- Pedaços reutilizados por todas as páginas (th:replace="~{fragments/layout :: nome}") -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${titulo} + ' · oilDynamics'">oilDynamics</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<nav th:fragment="navbar(ativo)" class="navbar navbar-expand od-navbar">
		<div class="container flex-wrap gap-2">
			<a class="navbar-brand" th:href="@{/}">oilDynamics</a>
			<ul class="navbar-nav flex-wrap me-auto">
				<li class="nav-item"><a class="nav-link" th:href="@{/campos}" th:classappend="${ativo == 'campos'} ? 'active'">Campos</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/pocos}" th:classappend="${ativo == 'pocos'} ? 'active'">Poços</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/producoes}" th:classappend="${ativo == 'producoes'} ? 'active'">Produção</a></li>
			</ul>
			<!-- logout é POST (com token CSRF, que o th:action adiciona sozinho) -->
			<form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-2">
				<span class="text-white-50 small" th:text="${#authentication?.name}">usuário</span>
				<button type="submit" class="btn btn-sm btn-od">Sair</button>
			</form>
		</div>
	</nav>

	<!-- Mensagens enviadas pelo controller via RedirectAttributes.addFlashAttribute -->
	<div th:fragment="mensagens">
		<div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>
		<div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
	</div>

	<footer th:fragment="rodape" class="od-rodape">
		<div class="container d-flex flex-wrap justify-content-between gap-2">
			<span>oilDynamics · Modernização do sistema de Petróleo e Gás</span>
			<span>ESEG · Programação Web · 2026</span>
		</div>
	</footer>

</body>
</html>
