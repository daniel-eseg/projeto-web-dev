<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Poço')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar('pocos')}"></nav>

	<main>
		<div class="container">
			<h1 class="h3 mb-3" th:text="${poco.id == null} ? 'Novo poço' : 'Editar poço ' + ${poco.codigo}">Poço</h1>

			<form th:action="@{/pocos/salvar}" th:object="${poco}" method="post" class="od-card" novalidate>
				<input type="hidden" th:field="*{id}">

				<div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
					<div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
				</div>

				<div class="row g-3">
					<div class="col-12 col-md-4">
						<label for="codigo" class="form-label">Código</label>
						<input type="text" th:field="*{codigo}" class="form-control" th:errorclass="is-invalid" placeholder="Ex.: PO00001">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
					</div>
					<div class="col-12 col-md-8">
						<label for="campo" class="form-label">Campo</label>
						<!-- envia campo.id; o service busca o Campo no banco -->
						<select id="campo" name="campo.id" class="form-select" th:classappend="${#fields.hasErrors('campo')} ? 'is-invalid'">
							<option value="">Selecione...</option>
							<option th:each="c : ${campos}" th:value="${c.id}" th:text="${c.codigo} + ' - ' + ${c.nomeBacia}"
								th:selected="${poco.campo != null and poco.campo.id == c.id}">CP0001</option>
						</select>
						<div class="od-erro-campo" th:if="${#fields.hasErrors('campo')}" th:errors="*{campo}"></div>
					</div>
					<div class="col-12 col-md-4">
						<label for="tipoPoco" class="form-label">Tipo</label>
						<input type="text" th:field="*{tipoPoco}" class="form-control" th:errorclass="is-invalid" placeholder="Ex.: Produtor">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('tipoPoco')}" th:errors="*{tipoPoco}"></div>
					</div>
					<div class="col-6 col-md-4">
						<label for="vazaoBarrisPorDia" class="form-label">Vazão (bbl/dia)</label>
						<input type="number" step="any" th:field="*{vazaoBarrisPorDia}" class="form-control" th:errorclass="is-invalid">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('vazaoBarrisPorDia')}" th:errors="*{vazaoBarrisPorDia}"></div>
					</div>
					<div class="col-6 col-md-4">
						<label for="dataInicio" class="form-label">Data de início</label>
						<input type="date" th:field="*{dataInicio}" class="form-control" th:errorclass="is-invalid">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}"></div>
					</div>
					<div class="col-12 col-md-4">
						<label for="statusPoco" class="form-label">Status</label>
						<select th:field="*{statusPoco}" class="form-select" th:errorclass="is-invalid">
							<option value="">Selecione...</option>
							<option th:each="s : ${statusOpcoes}" th:value="${s}" th:text="${s.descricao}">Ativo</option>
						</select>
						<div class="od-erro-campo" th:if="${#fields.hasErrors('statusPoco')}" th:errors="*{statusPoco}"></div>
					</div>
				</div>

				<div class="d-flex gap-2 mt-4">
					<button type="submit" class="btn btn-od">Salvar</button>
					<a th:href="@{/pocos}" class="btn btn-od-outline">Cancelar</a>
				</div>
			</form>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
