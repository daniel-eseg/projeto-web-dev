<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Campos')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar('campos')}"></nav>

	<main>
		<div class="container">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
				<h1 class="h3 mb-0">Campos</h1>
				<a th:href="@{/campos/novo}" class="btn btn-od">+ Novo campo</a>
			</div>

			<div th:replace="~{fragments/layout :: mensagens}"></div>

			<div th:if="${#lists.isEmpty(campos)}" class="od-card">Nenhum campo cadastrado.</div>

			<div th:unless="${#lists.isEmpty(campos)}" class="table-responsive">
				<table class="od-tabela">
					<thead>
						<tr>
							<th>Código</th>
							<th>Bacia</th>
							<th>UF</th>
							<th>Ambiente</th>
							<th>Status</th>
							<th class="text-end">Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c : ${campos}">
							<td th:text="${c.codigo}">CP0001</td>
							<td th:text="${c.nomeBacia}">Campos</td>
							<td th:text="${c.estado}">RJ</td>
							<td th:text="${c.ambiente}">Offshore</td>
							<td th:text="${c.status}">Produção</td>
							<td class="text-end text-nowrap">
								<a th:href="@{/campos/{id}/editar(id=${c.id})}" class="btn btn-sm btn-od-outline">Editar</a>
								<form th:action="@{/campos/{id}/excluir(id=${c.id})}" method="post" class="d-inline"
									onsubmit="return confirm('Excluir este campo e todos os seus poços e produções?');">
									<button type="submit" class="btn btn-sm btn-od-perigo">Excluir</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
