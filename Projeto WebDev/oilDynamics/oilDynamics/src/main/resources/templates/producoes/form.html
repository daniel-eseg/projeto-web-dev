<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produção')}"></head>
<body>
	<nav th:replace="~{fragments/layout :: navbar('producoes')}"></nav>

	<main>
		<div class="container">
			<h1 class="h3 mb-3" th:text="${producao.id == null} ? 'Registrar produção' : 'Editar produção ' + ${producao.codigo}">Produção</h1>

			<form th:action="@{/producoes/salvar}" th:object="${producao}" method="post" class="od-card" novalidate>
				<input type="hidden" th:field="*{id}">

				<div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
					<div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
				</div>

				<div class="row g-3">
					<div class="col-12 col-md-4">
						<label for="codigo" class="form-label">Código</label>
						<input type="text" th:field="*{codigo}" class="form-control" th:errorclass="is-invalid" placeholder="Ex.: PR000001">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
					</div>
					<div class="col-12 col-md-4">
						<label for="poco" class="form-label">Poço</label>
						<select id="poco" name="poco.id" class="form-select" th:classappend="${#fields.hasErrors('poco')} ? 'is-invalid'">
							<option value="">Selecione...</option>
							<option th:each="po : ${pocos}" th:value="${po.id}"
								th:text="${po.codigo} + ' (' + ${po.statusPoco.descricao} + ')'"
								th:selected="${producao.poco != null and producao.poco.id == po.id}">PO00001 (Ativo)</option>
						</select>
						<div class="od-erro-campo" th:if="${#fields.hasErrors('poco')}" th:errors="*{poco}"></div>
					</div>
					<div class="col-12 col-md-4">
						<label for="dataProducao" class="form-label">Data</label>
						<input type="date" th:field="*{dataProducao}" class="form-control" th:errorclass="is-invalid">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('dataProducao')}" th:errors="*{dataProducao}"></div>
					</div>
					<div class="col-6 col-md-3">
						<label for="volumeOleoBarris" class="form-label">Óleo (bbl)</label>
						<input type="number" step="any" min="0" th:field="*{volumeOleoBarris}" class="form-control" th:errorclass="is-invalid">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('volumeOleoBarris')}" th:errors="*{volumeOleoBarris}"></div>
					</div>
					<div class="col-6 col-md-3">
						<label for="volumeGasMetrosCubicos" class="form-label">Gás (m³)</label>
						<input type="number" step="any" min="0" th:field="*{volumeGasMetrosCubicos}" class="form-control" th:errorclass="is-invalid">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('volumeGasMetrosCubicos')}" th:errors="*{volumeGasMetrosCubicos}"></div>
					</div>
					<div class="col-6 col-md-3">
						<label for="eficienciaPercentual" class="form-label">Eficiência (%)</label>
						<input type="number" step="any" min="0" max="100" th:field="*{eficienciaPercentual}" class="form-control" th:errorclass="is-invalid">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('eficienciaPercentual')}" th:errors="*{eficienciaPercentual}"></div>
					</div>
					<div class="col-6 col-md-3">
						<label for="custoOperacional" class="form-label">Custo (R$)</label>
						<input type="number" step="any" min="0" th:field="*{custoOperacional}" class="form-control" th:errorclass="is-invalid">
						<div class="od-erro-campo" th:if="${#fields.hasErrors('custoOperacional')}" th:errors="*{custoOperacional}"></div>
					</div>
					<div class="col-12 col-md-6">
						<label for="refinariaDestino" class="form-label">Refinaria de destino (opcional)</label>
						<select id="refinariaDestino" name="refinariaDestino.id" class="form-select">
							<option value="">Sem destino</option>
							<option th:each="r : ${refinarias}" th:value="${r.id}" th:text="${r.codigo} + ' - ' + ${r.estado}"
								th:selected="${producao.refinariaDestino != null and producao.refinariaDestino.id == r.id}">RF001</option>
						</select>
						<div class="od-erro-campo" th:if="${#fields.hasErrors('refinariaDestino')}" th:errors="*{refinariaDestino}"></div>
					</div>
				</div>

				<div class="d-flex gap-2 mt-4">
					<button type="submit" class="btn btn-od">Salvar</button>
					<a th:href="@{/producoes}" class="btn btn-od-outline">Cancelar</a>
				</div>
			</form>
		</div>
	</main>

	<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
