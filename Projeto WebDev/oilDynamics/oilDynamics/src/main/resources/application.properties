spring.application.name=oilDynamics

# Banco H2 em arquivo (os dados ficam em ./data e sobrevivem ao reiniciar)
spring.datasource.url=jdbc:h2:file:./data/oildynamics
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Datas em formato ISO (yyyy-MM-dd), o mesmo que o <input type="date"> envia
spring.mvc.format.date=iso

# Usuário fictício de desenvolvimento (será substituído pelos perfis ADMIN/OPERADOR na 3ª entrega)
spring.security.user.name=admin
spring.security.user.password=admin123
